<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Combustible y Movilidad - Planilla K3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f2fe;
            color: #333;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 650px;
            background: rgba(240, 249, 255, 0.92); border: 1px solid #bae6fd;
            backdrop-filter: blur(3px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(14, 116, 144, 0.15);
            margin: 20px auto;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #bae6fd;
        }
        .header-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .header-text {
            text-align: left;
        }
        .header h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }
        .header p {
            color: #475569;
            font-size: 14px;
            margin-top: 4px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: rgba(255, 255, 255, 0.95);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            background-color: #ffffff;
        }
        input:invalid:not(:placeholder-shown), select:invalid:not(:focus), textarea:invalid:not(:placeholder-shown) {
            border-color: #ef4444;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        #otroMotivoGroup {
            display: none;
            margin-top: 10px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            color: #2563eb;
        }
        @media (max-width: 500px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .header {
                gap: 12px;
            }
            .header-logo {
                width: 58px;
                height: 58px;
            }
            .header h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Escudo Tercera Compañía" class="header-logo">
        <div class="header-text">
            <h2>Control de Combustible y Movilidad</h2>
            <p>Planilla K3 — Tercera Compañía</p>
        </div>
    </div>
    
    <form id="fuelForm">
        <div class="form-row">
            <div class="form-group">
                <label for="movil">Móvil:</label>
                <select id="movil" required>
                    <option value="" disabled selected>Seleccione un móvil</option>
                    <option value="AB-33">AB-33</option>
                    <option value="AB-34">AB-34</option>
                    <option value="AT-31">AT-31</option>
                    <option value="AR-32">AR-32</option>
                    <option value="X-3">X-3</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ci">C.I.:</label>
                <input type="text" id="ci" inputmode="numeric" pattern="[0-9]+" required placeholder="Solo números (sin puntos)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="salida">Lugar de Salida:</label>
                <input type="text" id="salida" required placeholder="Origen">
            </div>
            <div class="form-group">
                <label for="destino">Lugar de Destino:</label>
                <input type="text" id="destino" required placeholder="Destino">
            </div>
        </div>

        <div class="form-group">
            <label for="kmLlegada">Km de Llegada:</label>
            <input type="number" id="kmLlegada" inputmode="numeric" min="0" step="1" required placeholder="0">
        </div>

        <div class="form-group">
            <label for="motivoSelect">Motivo de Viaje:</label>
            <select id="motivoSelect" required>
                <option value="" disabled selected>Seleccione el motivo</option>
                <option value="10.40">10.40</option>
                <option value="10.41">10.41</option>
                <option value="10.43">10.43</option>
                <option value="10.51">10.51</option>
                <option value="Otros">Otros</option>
            </select>
            
            <div id="otroMotivoGroup">
                <label for="otroMotivo">Especifique el motivo:</label>
                <textarea id="otroMotivo" rows="2" placeholder="Detalle o descripción del servicio"></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn">Guardar Registro</button>
        <div class="loading" id="loadingMsg">Guardando en Google Drive...</div>
    </form>
</div>

<script>
    // Reemplazar con la URL desplegada de tu Google Apps Script
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQU9H1RYiWdR9MjTJVvWUSEhY5rfEAb0_NthbjfDZ3WUYgKxacXXy7BS25JexfEDdk/exec';

    // Filtrar en tiempo real para asegurar que solo se escriban dígitos en C.I. y Kilometraje
    const numericFields = ['ci', 'kmLlegada'];
    numericFields.forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    });

    // Mostrar u ocultar el campo manual cuando se elige "Otros"
    const motivoSelect = document.getElementById('motivoSelect');
    const otroMotivoGroup = document.getElementById('otroMotivoGroup');
    const otroMotivoInput = document.getElementById('otroMotivo');

    motivoSelect.addEventListener('change', function() {
        if (this.value === 'Otros') {
            otroMotivoGroup.style.display = 'block';
            otroMotivoInput.required = true;
            otroMotivoInput.focus();
        } else {
            otroMotivoGroup.style.display = 'none';
            otroMotivoInput.required = false;
            otroMotivoInput.value = '';
        }
    });

    const form = document.getElementById('fuelForm');
    form.addEventListener('submit', e => {
        e.preventDefault();

        const kmLlegadaVal = parseInt(document.getElementById('kmLlegada').value, 10);

        const motivoFinal = motivoSelect.value === 'Otros' 
            ? 'Otros: ' + otroMotivoInput.value.trim() 
            : motivoSelect.value;

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loadingMsg').style.display = 'block';

        const data = {
            movil: document.getElementById('movil').value,
            ci: document.getElementById('ci').value.trim(),
            salida: document.getElementById('salida').value.trim(),
            destino: document.getElementById('destino').value.trim(),
            kmSalida: "", // Se envía vacío para mantener intacta la estructura de la hoja
            kmLlegada: kmLlegadaVal,
            motivo: motivoFinal
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert('¡Registro guardado exitosamente!');
            form.reset();
            otroMotivoGroup.style.display = 'none';
            otroMotivoInput.required = false;
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loadingMsg').style.display = 'none';
        })
        .catch(error => {
            alert('Error al guardar: ' + error.message);
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loadingMsg').style.display = 'none';
        });
    });
</script>

</body>
</html>
